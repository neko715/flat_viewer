<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>楽譜ビューア</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3981ff">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f7f8fa;
    --border: #e6e8eb;
    --text: #1a1d21;
    --text-sub: #6b7280;
    --accent: #3981FF;
    --accent-soft: #eaf1ff;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-hover: 0 8px 24px rgba(57,129,255,0.12), 0 2px 6px rgba(0,0,0,0.05);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Inter", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- カテゴリ画面 ---------- */
  #category-screen {
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .section-switch {
    max-width: 700px;
    margin: 0 auto;
    width: 100%;
    padding: 4px 32px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  /* コントラバス表示中はテーマカラーを変えて、どちらのパートか一目で分かるようにする */
  body[data-section="contrabass"] {
    --accent: #e8590c;
    --accent-soft: #fff1e8;
  }

  .section-name {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #fff;
    background: var(--accent);
    padding: 8px 18px;
    border-radius: 999px;
  }

  .section-badge {
    display: inline-block;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #fff;
    background: var(--accent);
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 8px;
  }

  .section-switch-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  .section-switch-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  .empty-note {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-sub);
    font-size: 14px;
    padding: 32px 0;
  }

  .category-grid {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 24px 32px 48px;
    max-width: 700px;
    margin: 0 auto;
    width: 100%;
    justify-content: center;
  }

  .category-card {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 26px;
    cursor: pointer;
    text-align: left;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .category-card .sub {
    display: block;
    margin-top: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-sub);
  }

  .category-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .category-card:active {
    transform: translateY(0px) scale(0.99);
  }

  .category-card .icon {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  /* ---------- メニュー画面 ---------- */
  #menu-screen {
    height: 100%;
    width: 100%;
    display: none;
    flex-direction: column;
    overflow-y: auto;
  }

  .menu-header {
    padding: 24px 24px 16px;
    text-align: center;
    flex-shrink: 0;
    position: relative;
  }

  .menu-header h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }

  .menu-header p {
    margin: 0;
    color: var(--text-sub);
    font-size: 14px;
  }

  .menu-back-btn {
    position: absolute;
    left: 16px;
    top: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  .menu-back-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  .menu-back-btn svg {
    width: 14px;
    height: 14px;
  }

  .menu-header .service-desc {
    margin: 6px 0 0;
    color: var(--text-sub);
    font-size: 11px;
    opacity: 0.8;
  }

  .menu-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    padding: 24px 32px 48px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }

  .song-card {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px;
    cursor: pointer;
    text-align: left;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .song-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .song-card:active {
    transform: translateY(0px) scale(0.99);
  }

  .song-card .icon {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .song-card .title {
    flex: 1;
    line-height: 1.4;
  }

  /* ---------- 譜面画面 ---------- */
  #score-screen {
    height: 100%;
    width: 100%;
    display: none;
    flex-direction: column;
    position: relative;
  }

  .score-topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(6px);
    z-index: 10;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  .back-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  .back-btn:active {
    transform: scale(0.97);
  }

  .back-btn svg {
    width: 16px;
    height: 16px;
  }

  .score-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 1;
  }

  .fullscreen-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
    margin-left: auto;
  }

  .fullscreen-btn + .fullscreen-btn {
    margin-left: 0;
  }

  .fullscreen-btn svg {
    width: 16px;
    height: 16px;
  }

  .fullscreen-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  .fullscreen-btn:active {
    transform: scale(0.95);
  }

  .fullscreen-btn:disabled {
    opacity: 0.5;
    cursor: default;
    pointer-events: none;
  }

  .fullscreen-btn.is-loading svg {
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  .score-body {
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .score-body iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 10px;
    box-shadow: var(--shadow);
    display: block;
  }

  /* 1つの譜面のみのときは画面いっぱいに */
  .score-body.single {
    padding: 0;
  }
  .score-body.single iframe {
    border-radius: 0;
    box-shadow: none;
  }

  /* 曲ごとの注意書き */
  .score-notice {
    flex-shrink: 0;
    margin: 10px 12px 0;
    padding: 11px 14px;
    border: 1px solid #f3d28d;
    border-radius: 10px;
    background: #fff9e9;
    color: #79510a;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.6;
    animation: scoreNoticeFadeOut 5s ease-in forwards;
  }

  @keyframes scoreNoticeFadeOut {
    0%, 90% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* iframeを包むラッパー */
  .iframe-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 300px;
    display: flex;
  }

  .score-body.single .iframe-wrap {
    min-height: 0;
  }

  /* Flatロゴ(左下)を覆い隠すマスク */
  .logo-mask {
    position: absolute;
    left: 0px;
    bottom: 0;
    width: 110px;
    height: 52px;
    background: #1565EF;
    border-bottom-left-radius: 10px;
    z-index: 3;
    transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1), border-radius 0.3s ease;
  }

  /* 開いた瞬間（全幅時）は角丸なしの四角形 */
  .logo-mask.full-cover {
    width: 100%;
    border-radius: 0;
  }

  .part-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    padding: 0 4px;
  }
</style>
</head>

</div>

    },
    // ----- コントラバス -----
    {

      parts: [

      ]
    },
    {
      id: "sherry_contrabass",
      title: "シェリーにくちづけ",
      category: "concert",
      section: "contrabass",
      parts: [
        { label: null, embed: `<iframe src="https://flat.io/embed/6aec689224461e00a6395176?_l=true&sharingKey=253870561ce64f794670a937456fdd94621e2642537c44736ba4a4c455fe8091f909e93b52327f9450182f22f1961c5a0249f34db8c35b9da6658d99d5fdefa3&layout=page&parts=d79301bc-63cc-e333-ac75-4ecda637a7fa" frameBorder="0" allowfullscreen allow="autoplay; midi"></iframe>` }
      ]
    },
    {
      id: "zankoku_contrabass",
      title: "残酷な天使のテーゼ",
      category: "concert",
      section: "contrabass",
      parts: [
        { label: null, embed: `<iframe src="https://flat.io/embed/68fcd4cf0e77c0beb70a9edd?_l=true&sharingKey=977f3ad79de59bc2ca4acd83642ee7aab809bd76c3130b0e29e29317697393132119fb41adfce3888e3feae0b219239f985fa49e23232ca35e7c4423db0e7338&layout=page&parts=21ea219b-a3e7-2794-33db-a5494d63a884" frameBorder="0" allowfullscreen allow="autoplay; midi"></iframe>` }
      ]
    }
  ];

  // パート（セクション）定義
  // 既存の楽譜はすべてプライム。コントラバスの楽譜は、曲データに
  // section: "contrabass" を付けて追加する（現在はまだ未登録）。
  const sectionNames = { prime: "プライム", contrabass: "コントラバス" };
  let currentSection = "prime";

  function songsInSection(section) {
    return songs.filter(s => (s.section || "prime") === section);
  }

  // カテゴリ定義
  const categoryDefs = [
    { id: "required", title: "課題曲" },
    { id: "concert", title: "定期演奏会" }
  ];

  const categoryScreen = document.getElementById("category-screen");
  const categoryGrid = document.getElementById("category-grid");
  const sectionName = document.getElementById("section-name");
  const sectionSwitchBtn = document.getElementById("section-switch-btn");
  const menuSectionBadge = document.getElementById("menu-section-badge");
  const menuGrid = document.getElementById("menu-grid");
  const menuScreen = document.getElementById("menu-screen");
  const menuTitle = document.getElementById("menu-title");
  const menuBackBtn = document.getElementById("menu-back-btn");
  const scoreScreen = document.getElementById("score-screen");
  const scoreTitle = document.getElementById("score-title");
  const scoreBody = document.getElementById("score-body");
  const backBtn = document.getElementById("back-btn");
  const fullscreenBtn = document.getElementById("fullscreen-btn");
  const printBtn = document.getElementById("print-btn");

  // 現在表示中の曲（印刷対象のPDFを特定するために使用）
  let currentSong = null;

  // カテゴリ一覧を生成（現在のパート用）
  function renderCategories() {
    document.body.dataset.section = currentSection;
    document.querySelector('meta[name="theme-color"]').content =
      currentSection === "prime" ? "#3981ff" : "#e8590c";
    sectionName.textContent = sectionNames[currentSection];
    sectionSwitchBtn.textContent =
      currentSection === "prime" ? "コントラバスへ移動" : "プライムへ移動";
    categoryGrid.innerHTML = "";

    categoryDefs.forEach(catDef => {
      const count = songsInSection(currentSection)
        .filter(s => s.category === catDef.id).length;
      const cat = { ...catDef, sub: `${count}曲` };
      const card = document.createElement("button");
      card.className = "category-card";
      card.innerHTML = `
        <span>
          ${cat.title}
          <span class="sub">${cat.sub}</span>
        </span>
        <span class="icon">♪</span>
      `;
      card.addEventListener("click", () => openCategory(cat));
      categoryGrid.appendChild(card);
    });
  }

  // パート切り替え（プライム ⇔ コントラバス）
  sectionSwitchBtn.addEventListener("click", () => {
    currentSection = currentSection === "prime" ? "contrabass" : "prime";
    renderCategories();
  });

  renderCategories();

  function openCategory(cat) {
    menuSectionBadge.textContent = sectionNames[currentSection];
    menuTitle.textContent = `♪ ${cat.title}（${sectionNames[currentSection]}）`;
    menuGrid.innerHTML = "";

    const songsInCategory = songsInSection(currentSection)
      .filter(s => s.category === cat.id);

    if (songsInCategory.length === 0) {
      const note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = "まだ楽譜が登録されていません";
      menuGrid.appendChild(note);
    }

    songsInCategory.forEach(song => {
      const card = document.createElement("button");
      card.className = "song-card";
      card.innerHTML = `
        <span class="title">${song.title}</span>
        <span class="icon">♪</span>
      `;
      card.addEventListener("click", () => openScore(song));
      menuGrid.appendChild(card);
    });

    categoryScreen.style.display = "none";
    menuScreen.style.display = "flex";
  }

  function closeMenu() {
    menuScreen.style.display = "none";
    categoryScreen.style.display = "flex";
    menuGrid.innerHTML = "";
  }

  menuBackBtn.addEventListener("click", closeMenu);

  function openScore(song) {
    currentSong = song;
    scoreTitle.textContent = `${song.title}（${sectionNames[currentSection]}）`;
    scoreBody.innerHTML = "";
    scoreBody.classList.toggle("single", song.parts.length === 1);

    if (song.notice) {
      const notice = document.createElement("div");
      notice.className = "score-notice";
      notice.setAttribute("role", "note");
      notice.textContent = song.notice;
      scoreBody.appendChild(notice);
      // 5秒後に注意書きを取り除き、楽譜の表示領域を元に戻す
      setTimeout(() => notice.remove(), 5000);
    }

    song.parts.forEach(part => {
      if (part.label) {
        const label = document.createElement("div");
        label.className = "part-label";
        label.textContent = part.label;
        scoreBody.appendChild(label);
      }

      const wrap = document.createElement("div");
      wrap.className = "iframe-wrap";

      const temp = document.createElement("div");
      temp.innerHTML = part.embed;
      wrap.appendChild(temp.firstElementChild);

      const mask = document.createElement("div");
      mask.className = "logo-mask full-cover";
      wrap.appendChild(mask);

      setTimeout(() => {
        mask.classList.remove("full-cover");
      }, 1600);

      scoreBody.appendChild(wrap);
    });

    menuScreen.style.display = "none";
    scoreScreen.style.display = "flex";
    scoreBody.scrollTop = 0;
  }

  // ★ 楽譜画面を閉じる時の処理（全画面解除を追加！）
  function closeScore() {
    // もし全画面表示中なら解除する
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }

    scoreScreen.style.display = "none";
    menuScreen.style.display = "flex";
    scoreBody.innerHTML = "";
    currentSong = null;
  }

  backBtn.addEventListener("click", closeScore);

  function toggleFullscreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const target = scoreScreen;
      if (target.requestFullscreen) {
        target.requestFullscreen();
      } else if (target.webkitRequestFullscreen) {
        target.webkitRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
  }

  fullscreenBtn.addEventListener("click", toggleFullscreen);

  // ---------- 表示中の楽譜(PDF)を印刷 ----------
  // flat.io の埋め込みiframeはクロスオリジンで印刷できないため、
  // 表示中の曲に対応するPDF（同一オリジン、 <song.id>.pdf ）を
  // pdf.js でcanvasに描画し、別ウィンドウを開いて印刷する。
  async function printScore() {
    if (!currentSong) return;

    const pdfUrl = `${currentSong.id}.pdf`;

    setPrintButtonLoading(true);
    try {
      const loadingTask = pdfjsLib.getDocument(pdfUrl);
      const pdf = await loadingTask.promise;

      // 印刷用に高解像度でレンダリング
      const PRINT_SCALE = 2;
      const pageImages = [];

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: PRINT_SCALE });

        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext("2d");

        await page.render({ canvasContext: ctx, viewport }).promise;
        pageImages.push({
          dataUrl: canvas.toDataURL("image/png"),
          width: viewport.width,
          height: viewport.height
        });
      }

      openPrintWindow(pageImages, currentSong.title);
    } catch (err) {
      console.error("PDFの印刷準備に失敗しました:", err);
      alert(
        "楽譜PDFの印刷準備に失敗しました。\n" +
        `対象ファイル: ${pdfUrl}\n` +
        `エラー: ${err.message}`
      );
    } finally {
      setPrintButtonLoading(false);
    }
  }

  function setPrintButtonLoading(isLoading) {
    printBtn.disabled = isLoading;
    printBtn.classList.toggle("is-loading", isLoading);
  }

  // レンダリング済みページ画像を新規ウィンドウに並べて印刷する
  function openPrintWindow(pageImages, title) {
    const printWindow = window.open("", "_blank");
    if (!printWindow) {
      alert("ポップアップがブロックされました。ブラウザの設定でポップアップを許可してください。");
      return;
    }

    // インラインで幅・高さを両方pxで固定すると、印刷時に幅だけが
    // ページ幅へ縮小されて縦横比が崩れるため、画像側には指定を持たせず
    // 幅100%・高さautoのCSSだけで元のアスペクト比を保つようにする。
    const imagesHtml = pageImages
      .map(img => `<img src="${img.dataUrl}" alt="page">`)
      .join("\n");

    printWindow.document.open();
    printWindow.document.write(`<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>${escapeHtml(title)}</title>
<style>
  @page { margin: 0; }
  html, body { margin: 0; padding: 0; }
  img {
    display: block;
    width: 100%;
    height: auto;
    page-break-after: always;
    page-break-inside: avoid;
  }
  img:last-child { page-break-after: auto; }
</style>
</head>
<body>
${imagesHtml}
</body>
</html>`);
    printWindow.document.close();

    // 印刷ダイアログが閉じた（印刷 or キャンセル）タイミングでウィンドウを自動で閉じる
    printWindow.onafterprint = () => {
      printWindow.close();
    };

    // 画像の読み込みを待ってから印刷ダイアログを開く
    const imgs = printWindow.document.images;
    let loaded = 0;
    const total = imgs.length;

    if (total === 0) {
      printWindow.focus();
      printWindow.print();
      return;
    }

    Array.from(imgs).forEach(img => {
      if (img.complete) {
        onImgReady();
      } else {
        img.addEventListener("load", onImgReady);
        img.addEventListener("error", onImgReady);
      }
    });

    function onImgReady() {
      loaded++;
      if (loaded >= total) {
        printWindow.focus();
        printWindow.print();
      }
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  printBtn.addEventListener("click", printScore);

  // ---------- 最新版チェック（GitHub上の最新index.htmlとの比較） ----------
  // 本番URL（常に最新のデプロイが配信される）
  const PRODUCTION_URL = "https://flat-view.pages.dev/";
  // 最新版の取得先（GitHubのmainブランチにあるindex.htmlそのもの）
  const LATEST_INDEX_URL =
    "https://raw.githubusercontent.com/neko715/flat_viewer/main/index.html";
  // チェック間隔（ミリ秒）
  const UPDATE_CHECK_INTERVAL_MS = 5 * 60 * 1000;

  // 自分が配信されているindex.htmlを取得する
  async function fetchOwnIndexHtml() {
    const url = new URL("./index.html", location.href);
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) {
      throw new Error(`自分のindex.htmlの取得に失敗しました (status: ${res.status})`);
    }
    return res.text();
  }

  // GitHub上の最新index.htmlを取得する
  // ※raw.githubusercontent.comのキャッシュにより、反映が最大で数分遅れることがある
  async function fetchLatestIndexHtml() {
    const res = await fetch(LATEST_INDEX_URL, { cache: "no-store" });
    if (!res.ok) {
      throw new Error(`最新のindex.htmlの取得に失敗しました (status: ${res.status})`);
    }
    return res.text();
  }

  // 最新版が確認できたら、右上の緑バッジを表示する
  function showLatestBadge() {
    document.getElementById("latestBadge").style.display = "block";
  }

  // 読み込んだ時点で配信されていた自分のindex.html
  // （開きっぱなしのタブが古くなったかどうかを判定するために保持する）
  let loadedOwnHtml = null;

  async function checkForUpdate() {
    try {
      const [ownHtml, latestHtml] = await Promise.all([
        fetchOwnIndexHtml(),
        fetchLatestIndexHtml(),
      ]);

      if (loadedOwnHtml === null) {
        // 初回チェック: 読み込んだ時点の版を記録する
        loadedOwnHtml = ownHtml;
      } else if (ownHtml !== loadedOwnHtml) {
        // 読み込んだ後に新しいデプロイが配信され始めた（タブが古くなった）
        // 通知は出さず、そのまま本番URLへ移動して最新版を読み直す
        location.href = PRODUCTION_URL;
        return;
      }

      if (ownHtml !== latestHtml) {
        if (location.hostname !== "flat-view.pages.dev") {
          // デプロイURLで開いていて古い場合は、本番URLへ移動する
          location.href = PRODUCTION_URL;
        }
        // 本番URLで開いている場合はデプロイの反映待ちなので何もしない
        return;
      }

      // 最新版が確認できたのでバッジを表示する
      showLatestBadge();
    } catch (err) {
      // 取得に失敗した場合は何もせず、次のチェックで再試行する
      console.error("最新版チェック中にエラーが発生しました:", err);
    }
  }

  // 初回実行 + 定期チェック + 画面に戻ってきたときにもチェック
  checkForUpdate();
  setInterval(checkForUpdate, UPDATE_CHECK_INTERVAL_MS);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      checkForUpdate();
    }
  });
</script>

<!-- 最新版バッジ（最新版が確認できたときだけ右上に表示される） -->
<div id="latestBadge" style="
  display:none;
  position:fixed;
  top:10px;
  right:10px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#2fbf71;
  border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.35);
  z-index:10000;
  pointer-events:none;
" title="最新版です"></div>
</body>
